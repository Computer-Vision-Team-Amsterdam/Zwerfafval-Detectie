[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zwerfafval_detectie"
version = "0.1"
description = "Detectie van zwerfafval op straatbeelden."
authors = [
    {name = "Daan Bloembergen", email = "d.bloembergen@amsterdam.nl"},
]
maintainers = [
    { name = "Computer Vision Team, Gemeente Amsterdam", email = "cvt@amsterdam.nl" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aml_interface",
    "cvtoolkit",
    "folium>=0.12",
    "geopandas",
    "matplotlib",
    "mapclassify",
    "numpy",
    "shapely",
    "scikit-learn",
    "ultralytics>=8.3.0",
    "xyzservices",
    "yolo_model_development_kit",
]

[project.optional-dependencies]
dev = [
    "azure-identity-broker",
    "dataframe_image", 
    "html2image",
    "ipykernel==6.*",
    "ipywidgets",
    "nbstripout>=0.7.1",
    "opencv-python<4.13",
    "openpyxl",
    "pre-commit>=3.2.0",
    "pytest>=7.0.1",
    "pytest-cov>=4.0.0",
    "safety>=3.2.4",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]
cu128 = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "dev" },
        { extra = "cu128" },
    ],
]

[tool.uv.sources]
aml_interface = { git = "https://github.com/Computer-Vision-Team-Amsterdam/AML-Interface.git", tag = "v1.1.5" }
cvtoolkit = { git = "https://github.com/Computer-Vision-Team-Amsterdam/CVToolkit.git", tag = "v2.0.7" }
yolo_model_development_kit = { git = "https://github.com/Computer-Vision-Team-Amsterdam/YOLO-model-development-kit.git", tag = "v1.4.7" }
torch = [
    { index = "pytorch-cpu", extra = "dev" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "dev" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
include=["zwerfafval_detectie"]

[tool.isort]
profile = "black"
multi_line_output = 3
